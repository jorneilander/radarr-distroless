on:
  workflow_dispatch:
  pull_request:

  # push:
  # schedule:
  #   - cron: "0 3 * * *"

jobs:
  get-radarr-version:
    runs-on: ubuntu-22.04
    outputs:
      radarr-version: ${{ steps.radarr-version-step.outputs.LATEST_RADARR_VERSION }}
      should-build: ${{ steps.should-build-step.outputs.SHOULD_BUILD }}
    steps:
      # NOTE: version fetching gotten from:
      #       https://github.com/linuxserver/docker-radarr/blob/acededb0cb8f20e28dd8b4336bd2b955080fde89/Dockerfile#L24
      - run: >-
          echo LATEST_RADARR_VERSION=$(
          curl -sL "https://radarr.servarr.com/v1/update/master/changes?runtime=netcore&os=linux"
          | jq -r '.[0].version'
          )
          | tee -a "$GITHUB_ENV" "$GITHUB_OUTPUT"
        id: radarr-version-step
      - run: >-
          docker manifest inspect "docker.io/guillaumedsde/radarr-distroless:${LATEST_RADARR_VERSION}"
          || echo SHOULD_BUILD=1 >> "$GITHUB_OUTPUT"
        id: should-build-step

  docker:
    runs-on: ubuntu-24.04
    needs: get-radarr-version
    if: ${{ needs.get-radarr-version.outputs.should-build == '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # - name: Login to Docker Hub
      #   if: github.ref == '${{ github.event.repository.default_branch }}'
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        if: github.ref == '${{ github.event.repository.default_branch }}'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ inputs.image-name }}
          # docker.io/${{ inputs.image-name }}
          tags: |
            type=raw,value=${{ inputs.software-version }},enable=${{ inputs.software-version != ''}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - name: Build for test
        id: build
        uses: docker/build-push-action@v6
        with:
          load: true
          tags: ${{ inputs.image-name }}:test
          build-args: |
            VERSION=${{ inputs.software-version || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # TODO: use with github code scanning
      #       https://github.com/aquasecurity/trivy-action#using-trivy-with-github-code-scanning
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.29.0
        continue-on-error: true
        with:
          image-ref: ${{ steps.build.outputs.imageid }}
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
      # Push image to docker registries (rebuilds images using cache from previous steps)
